apiVersion: b2ai.dev/v1
kind: Agent
metadata:
  id: travel
  name: Travel
  description: Trip planning and booking specialist — flights, lodging, itineraries. Bookings require
    user approval.
  icon: plane
  version: 1.1.0
  authors:
  - name: b2ai
  license: Apache-2.0
  tags:
  - personal
  - travel
spec:
  model:
    name: claude-sonnet-5-5
    effort: medium
  prompt: prompt.md
  tools:
  - curl
  extensions:
    required:
    - calendar
    optional:
    - kb
  capabilities:
  - id: travel.search_flights
    description: Search flight options between cities.
    inputs:
      type: object
      properties:
        origin:
          type: string
        destination:
          type: string
        depart_date:
          type: string
          format: date
        return_date:
          type: string
          format: date
        passengers:
          type: integer
          default: 1
        max_results:
          type: integer
          default: 5
      required:
      - origin
      - destination
      - depart_date
    outputs:
      type: object
      properties:
        flights:
          type: array
          items:
            type: object
      required:
      - flights
    risk_level: none
  - id: travel.search_lodging
    description: Search hotels / rentals in a destination.
    inputs:
      type: object
      properties:
        destination:
          type: string
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        guests:
          type: integer
          default: 2
        max_price_per_night:
          type: number
      required:
      - destination
      - check_in
      - check_out
    outputs:
      type: object
      properties:
        options:
          type: array
          items:
            type: object
      required:
      - options
    risk_level: none
  - id: travel.compare_itineraries
    description: Compare alternative itineraries side-by-side.
    inputs:
      type: object
      properties:
        itinerary_ids:
          type: array
          items:
            type: string
          minItems: 2
      required:
      - itinerary_ids
    outputs:
      type: object
      properties:
        comparison:
          type: object
      required:
      - comparison
    risk_level: none
  - id: travel.draft_itinerary
    description: Create a draft itinerary entry in KB (no bookings).
    inputs:
      type: object
      properties:
        title:
          type: string
        destination:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        items:
          type: array
          items:
            type: object
      required:
      - title
      - destination
      - start_date
      - end_date
    outputs:
      type: object
      properties:
        itinerary_id:
          type: string
      required:
      - itinerary_id
    risk_level: low
  - id: travel.book_flight
    description: Purchase a flight (HIGH — financial commitment).
    inputs:
      type: object
      properties:
        itinerary_id:
          type: string
        flight_reference:
          type: string
        total_price:
          type: number
        currency:
          type: string
          description: ISO 4217 currency code; when omitted, the user's own currency from context.
        passenger_details:
          type: array
          items:
            type: object
      required:
      - flight_reference
      - total_price
      - passenger_details
    outputs:
      type: object
      properties:
        booking_reference:
          type: string
      required:
      - booking_reference
    risk_level: high
    requires_user_approval: true
  - id: travel.book_lodging
    description: Purchase lodging (HIGH — financial commitment).
    inputs:
      type: object
      properties:
        itinerary_id:
          type: string
        lodging_reference:
          type: string
        total_price:
          type: number
        currency:
          type: string
          description: ISO 4217 currency code; when omitted, the user's own currency from context.
        guest_details:
          type: array
          items:
            type: object
      required:
      - lodging_reference
      - total_price
      - guest_details
    outputs:
      type: object
      properties:
        booking_reference:
          type: string
      required:
      - booking_reference
    risk_level: high
    requires_user_approval: true
  - id: travel.book_car_rental
    description: Reserve a car rental (HIGH).
    inputs:
      type: object
      properties:
        itinerary_id:
          type: string
        rental_reference:
          type: string
        total_price:
          type: number
        currency:
          type: string
          description: ISO 4217 currency code; when omitted, the user's own currency from context.
      required:
      - rental_reference
      - total_price
    outputs:
      type: object
      properties:
        booking_reference:
          type: string
      required:
      - booking_reference
    risk_level: high
    requires_user_approval: true
  - id: travel.book_activity
    description: Book a paid activity / tour (MEDIUM — typically refundable).
    inputs:
      type: object
      properties:
        itinerary_id:
          type: string
        activity_name:
          type: string
        when_iso:
          type: string
          format: date-time
        total_price:
          type: number
        currency:
          type: string
          description: ISO 4217 currency code; when omitted, the user's own currency from context.
      required:
      - activity_name
      - when_iso
      - total_price
    outputs:
      type: object
      properties:
        booking_reference:
          type: string
      required:
      - booking_reference
    risk_level: medium
  - id: travel.cancel_booking
    description: Cancel a booking and check refund status.
    inputs:
      type: object
      properties:
        booking_reference:
          type: string
        reason:
          type: string
      required:
      - booking_reference
    outputs:
      type: object
      properties:
        cancelled:
          type: boolean
        refund_amount:
          type: number
      required:
      - cancelled
    risk_level: medium
  - id: travel.itinerary_to_calendar
    description: Push itinerary items to the user's calendar.
    inputs:
      type: object
      properties:
        itinerary_id:
          type: string
      required:
      - itinerary_id
    outputs:
      type: object
      properties:
        event_ids:
          type: array
          items:
            type: string
      required:
      - event_ids
    risk_level: low
